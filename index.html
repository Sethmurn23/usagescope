              ${metricCard("Budget utilization", `${Math.round(totalPercent)}%`, 0, "up", "across all limits", "efficiency", "#2873bd", "#eaf4ff")}
              ${metricCard("Active alerts", String(alerts.length), alerts.length ? 1 : 0, alerts.length ? "up" : "down", alerts.length ? "need attention" : "all clear", "alert", alerts.length ? "#b76a08" : "#16855b", alerts.length ? "#fff6e6" : "#eaf8f1")}

            <div class="dashboard-grid">
              <section class="card" aria-labelledby="budgetRulesTitle">

                  <div>
                    <h3 class="card-title" id="budgetRulesTitle">Budget rules</h3>
                    <p class="card-subtitle">Usage is evaluated against each enabled limit</p>

                  <table>
                    <thead><tr><th>Budget</th><th>Scope</th><th>Limit</th><th>Current spend</th><th>Utilization</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                      ${state.budgets.length ? state.budgets.map(budget => {
                        const spend = getBudgetSpend(budget);
                        const percent = budget.limit ? spend / budget.limit * 100 : 0;
                        const budgetState = getBudgetState(percent);
                        return `<tr>
                          <td><div class="provider-name">${escapeHtml(budget.name)}</div><div class="provider-model">${budget.enabled ? "Active" : "Paused"}</div></td>
                          <td><span class="tag">${escapeHtml(budget.scope === "all" ? "Workspace" : budget.scope)}</span></td>
                          <td>${formatCurrency(budget.limit, 0)}</td>
                          <td><strong>${formatCurrency(spend)}</strong></td>
                          <td class="cost-bar-cell"><strong>${Math.round(percent)}%</strong><div class="cost-bar"><span style="width:${Math.min(100, percent)}%;--bar-color:${budgetState.color}"></span></div></td>
                          <td><span class="badge ${budgetState.className}">${budgetState.label}</span></td>
                          <td><div class="row-actions"><button class="row-action" type="button" data-action="edit-budget" data-id="${budget.id}" aria-label="Edit budget">${ICONS.edit}</button><button class="row-action delete" type="button" data-action="delete-budget" data-id="${budget.id}" aria-label="Delete budget">${ICONS.trash}</button></div></td>

                    <button class="button button-primary" type="submit">Save policy</button>
                  </div>
                </form>
              </div>
            </section>
          </section>`;
      }

        if (action === "delete-usage") deleteUsage(event.currentTarget.dataset.id);
        if (action === "navigate-usage") navigateTo("usage");
        if (action === "import-usage") openImportModal();
        if (action === "export-dashboard") exportDashboard();
        if (action === "export-comparison") exportComparison();
        if (action === "export-budgets") exportBudgets();
        if (action === "export-team") exportTeam();

      function handleQuickUsage(event) {
        event.preventDefault();
        const form = event.currentTarget;
        if (!validateForm(form)) return;
        const formData = new FormData(form);
        const model = formData.get("model");
        const record = buildUsageRecord({
          date: formData.get("date"),
          memberId: formData.get("memberId"),
          model,
          tasks: Number(formData.get("tasks")),
          inputTokens: Number(formData.get("inputTokens")),
          outputTokens: Number(formData.get("outputTokens")),
          project: String(formData.get("project")).trim(),
          taskType: formData.get("taskType")
        });
        state.usage.push(record);
        addActivity("usage", "Usage record added", `${record.model} · ${formatCurrency(record.cost)} · ${record.tasks} tasks`);
        saveState();
        showToast("Usage added", `${record.project} was recorded at ${formatCurrency(record.cost)}.`);
        form.reset();
        document.getElementById("quickDate").value = isoDate(new Date());
        render();
      }

      function buildUsageRecord(values) {
        const modelData = MODEL_CATALOG[values.model];
        const member = state.team.find(item => item.id === values.memberId);
        const cost = (
          Number(values.inputTokens || 0) / 1000000 * modelData.input +
          Number(values.outputTokens || 0) / 1000000 * modelData.output
        ) * (VENDORS[modelData.vendor]?.rate || 1);
        return {
          id: `u-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          date: values.date,
          memberId: values.memberId,
          team: values.team || member?.team || "Unassigned",
          vendor: modelData.vendor,
          model: values.model,
          project: values.project,
          taskType: values.taskType || "Other",
          inputTokens: Number(values.inputTokens || 0),
          outputTokens: Number(values.outputTokens || 0),
          tasks: Number(values.tasks || 0),
          cost: Math.round(cost * 10000) / 10000,
          note: values.note || "Manually logged"
        };
      }

      function validateForm(form) {
        let valid = true;
        form.querySelectorAll("input, select, textarea").forEach(input => {
          const field = input.closest(".field");
          if (!field) return;
          let inputValid = input.checkValidity();
          if (input.type === "number") {
            inputValid = inputValid && input.value !== "";
          }
          if (input.required && input.value.trim() === "") inputValid = false;
          field.classList.toggle("invalid", !inputValid);
          input.setAttribute("aria-invalid", String(!inputValid));
          if (!inputValid) valid = false;
        });
        if (!valid) {
          const firstInvalid = form.querySelector(".field.invalid input, .field.invalid select, .field.invalid textarea");
          if (firstInvalid) firstInvalid.focus();
        }
        return valid;
      }

        render();

      function deleteMember(id) {

        const usageCount = state.usage.filter(item => item.memberId === id).length;

          ? `Delete ${member.name}? Their ${usageCount} usage records will become unassigned.`

        state.team = state.team.filter(item => item.id !== id);
        state.usage.forEach(item => {

            item.memberId = "";
            item.team = "Unassigned";

        showToast("Member removed", "Usage attribution was updated.", "warning");

        state.comparison.inputTokensPerTask = Number(data.get("inputTokensPerTask"));
        state.comparison.outputTokensPerTask = Number(data.get("outputTokensPerTask"));

        saveState();
        addActivity("comparison", "Model comparison updated", `${formatNumber(state.comparison.monthlyTasks)} monthly tasks`);

        render();

      function applyRecommendation() {
        const models = state.comparison.selectedModels.map(name => ({ name, ...MODEL_CATALOG[name] })).filter(model => model.name);
        const eligible = models.filter(model => model.quality >= state.comparison.requiredQuality).sort((a, b) => {
          const costA = state.comparison.monthlyTasks * (state.comparison.inputTokensPerTask / 1000000 * a.input + state.comparison.outputTokensPerTask / 1000000 * a.output);
          const costB = state.comparison.monthlyTasks * (state.comparison.inputTokensPerTask / 1000000 * b.input + state.comparison.outputTokensPerTask / 1000000 * b.output);
          return costA - costB;
        });
        if (!eligible.length) {
          showToast("No eligible model", "No selected model meets the quality target.", "error");
          return;
        }
        const best = eligible[0];
        state.comparison.selectedModels = [best.name];
        saveState();
        addActivity("comparison", "Recommended model applied", `${best.name} selected for workload planning`);
        showToast("Recommendation applied", `${best.name} is now the selected comparison model.`);
        render();
      }

      function handleBudgetSettings(event) {
        event.preventDefault();
        const form = event.currentTarget;
        if (!validateForm(form)) return;
        const data = new FormData(form);
        const warning = Number(data.get("warningThreshold"));
        const critical = Number(data.get("criticalThreshold"));
        if (critical <= warning) {
          showToast("Invalid thresholds", "The critical threshold must be higher than the warning threshold.", "error");
          return;
        }
        state.workspace.monthlyBudget = Number(data.get("monthlyBudget"));
        state.workspace.warningThreshold = warning;
        state.workspace.criticalThreshold = critical;
        saveState();
        showToast("Budget policy saved", "Your thresholds have been updated.");
        render();
      }

      function handleWorkspaceSettings(event) {
        event.preventDefault();
        const form = event.currentTarget;
        if (!validateForm(form)) return;
        const data = new FormData(form);
        state.workspace.name = String(data.get("name")).trim();
        state.workspace.currency = data.get("currency");
        state.settings.defaultCurrency = data.get("currency");
        saveState();
        showToast("Workspace saved", "Your workspace profile was updated.");
        render();
      }

      function savePreferences() {
        state.settings.includeCacheSavings = document.getElementById("includeCacheSavings").checked;

        state.settings.weeklyDigest = document.getElementById("weeklyDigest").checked;

        showToast("Preferences saved", "Tracking preferences were updated.");
      }

      function saveAlertPolicy() {
        const warning = Number(document.getElementById("settingsWarning").value);
        const critical = Number(document.getElementById("settingsCritical").value);
        if (critical <= warning) {
          showToast("Invalid thresholds", "Critical must be higher than warning.", "error");
          return;

        state.workspace.criticalThreshold = critical;
        state.workspace.alertsEnabled = document.getElementById("alertsEnabled").checked;

      function openImportModal() {
        modalMode = "import";
        document.getElementById("modalTitle").textContent = "Import usage CSV";
        document.getElementById("modalSubtitle").textContent = "Add a batch of records using the template below.";
        document.getElementById("modalConfirm").textContent = "Choose CSV file";
        document.getElementById("modalBody").innerHTML = `
          <div class="callout" style="margin-bottom:14px">${ICONS.info}<p>Required columns: date, member, team, vendor, model, project, task_type, input_tokens, output_tokens, tasks. Costs are recalculated from supported model rates.</p></div>
          <div class="field">
            <label for="csvFile">CSV file</label>
            <input id="csvFile" type="file" accept=".csv,text/csv">
            <div class="field-hint">Download a template first if you need the exact structure.</div>
          </div>
          <button class="button" type="button" data-modal-action="download-template" style="margin-top:12px">${ICONS.download} Download CSV template</button>`;
        showModal();
        document.querySelector('[data-modal-action="download-template"]').addEventListener("click", downloadCsvTemplate);
        document.getElementById("modalConfirm").onclick = () => {
          const input = document.getElementById("csvFile");
          if (!input.files || !input.files[0]) {
            showToast("No file selected", "Choose a CSV file before importing.", "error");
            return;
          }
          importCsvFile(input.files[0]);
        };
      }

      function downloadCsvTemplate() {
        const header = "date,member,team,vendor,model,project,task_type,input_tokens,output_tokens,tasks\n";
        const sample = `${isoDate(new Date())},Maya Chen,Delivery,OpenAI,GPT-4o mini,Example project,Classification,120000,25000,800\n`;
        downloadTextFile("usagescope-template.csv", header + sample, "text/csv");
        showToast("Template downloaded", "Use it to prepare a batch of usage records.");
      }

      function importCsvFile(file) {
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const text = String(event.target.result || "");
            const rows = parseCsv(text);
            if (!rows.length) throw new Error("The CSV does not contain any data rows.");
            const required = ["date", "member", "team", "vendor", "model", "project", "task_type", "input_tokens", "output_tokens", "tasks"];
            const headers = rows.headers.map(header => header.trim().toLowerCase());
            const missing = required.filter(header => !headers.includes(header));
            if (missing.length) throw new Error(`Missing columns: ${missing.join(", ")}.`);
            let imported = 0;
            let skipped = 0;
            rows.rows.forEach(row => {
              const values = {};
              rows.headers.forEach((header, index) => {
                values[header.trim().toLowerCase()] = String(row[index] || "").trim();
              });
              const modelName = Object.keys(MODEL_CATALOG).find(name => name.toLowerCase() === values.model.toLowerCase());
              const tasks = Number(values.tasks);
              const inputTokens = Number(values.input_tokens);
              const outputTokens = Number(values.output_tokens);
              if (!modelName || !values.date || !values.project || !Number.isFinite(tasks) || tasks <= 0 || !Number.isFinite(inputTokens) || inputTokens < 0 || !Number.isFinite(outputTokens) || outputTokens < 0) {
                skipped++;
                return;
              }
              const member = state.team.find(item => item.name.toLowerCase() === values.member.toLowerCase());
              const modelData = MODEL_CATALOG[modelName];
              const cost = (inputTokens / 1000000 * modelData.input + outputTokens / 1000000 * modelData.output) * (VENDORS[modelData.vendor]?.rate || 1);
              state.usage.push({
                id: `u-${Date.now()}-${imported}-${Math.random().toString(16).slice(6)}`,
                date: values.date,
                memberId: member?.id || "",
                team: member?.team || values.team || "Unassigned",
                vendor: modelData.vendor,
                model: modelName,
                project: values.project,
                taskType: values.task_type || "Other",
                inputTokens,
                outputTokens,
                tasks,
                cost: Math.round(cost * 10000) / 10000,
                note: `Imported from ${file.name}`
              });
              imported++;
            });
            if (!imported) throw new Error("No valid usage rows were found. Check the model names, dates, and numeric fields.");
            addActivity("usage", "Usage CSV imported", `${imported} records from ${file.name}`);
            saveState();
            closeModal();
            render();
            showToast("Import complete", `${imported} record${imported === 1 ? "" : "s"} imported${skipped ? `; ${skipped} skipped` : ""}.`, skipped ? "warning" : "success");
          } catch (error) {
            showToast("Import failed", error.message || "The file could not be processed.", "error");
          }
        };
        reader.onerror = () => showToast("Import failed", "The selected file could not be read.", "error");
        reader.readAsText(file);
      }

      function parseCsv(text) {
        const rows = [];
        let current = [];
        let value = "";
        let quoted = false;
        const clean = text.replace(/^\uFEFF/, "");
        for (let index = 0; index < clean.length; index++) {
          const char = clean[index];
          if (char === '"' && quoted && clean[index + 1] === '"') {
            value += '"';
            index++;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            current.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && clean[index + 1] === "\n") index++;
            current.push(value);
            if (current.some(cell => cell.trim() !== "")) rows.push(current);
            current = [];
            value = "";
          } else {
            value += char;
          }
        }
        current.push(value);
        if (current.some(cell => cell.trim() !== "")) rows.push(current);
        if (rows.length < 2) return { headers: rows[0] || [], rows: [] };
        return { headers: rows[0], rows: rows.slice(1) };
      }

      function openFileImport() {
        modalMode = "backup";
        document.getElementById("modalTitle").textContent = "Import workspace backup";
        document.getElementById("modalSubtitle").textContent = "Restore a previously exported Usagescope JSON file.";

        document.getElementById("modalBody").innerHTML = `
          <div class="callout" style="margin-bottom:14px">${ICONS.alert}<p>Importing replaces your current workspace usage, budgets, team, and settings. Export a backup first if needed.</p></div>
          <div class="field">
            <label for="backupFile">JSON backup</label>
            <input id="backupFile" type="file" accept=".json,application/json">
          </div>`;
        showModal();
        document.getElementById("modalConfirm").onclick = () => {
          const input = document.getElementById("backupFile");
          if (!input.files || !input.files[0]) {
            showToast("No file selected", "Choose a JSON backup before restoring.", "error");
            return;
          }
          const reader = new FileReader();
          reader.onload = event => {
            try {
              const imported = JSON.parse(String(event.target.result));
              if (!imported || !Array.isArray(imported.usage) || !Array.isArray(imported.team)) throw new Error("This is not a valid Usagescope backup.");
              state = {
                ...makeSeedState(),
                ...imported,
                workspace: { ...makeSeedState().workspace, ...(imported.workspace || {}) },
                settings: { ...makeSeedState().settings, ...(imported.settings || {}) },
                comparison: { ...makeSeedState().comparison, ...(imported.comparison || {}) }
              };
              saveState();
              closeModal();
              render();
              showToast("Backup restored", "Your workspace data was successfully replaced.");
            } catch (error) {
              showToast("Restore failed", error.message || "The backup could not be read.", "error");
            }
          };
          reader.onerror = () => showToast("Restore failed", "The selected file could not be read.", "error");
          reader.readAsText(input.files[0]);
        };

      function exportDashboard() {
        const usage = filteredUsage(currentPeriod);

      function exportComparison() {
        const rows = [["Model", "Vendor", "Estimated Monthly Cost", "Cost per Task", "Quality", "Speed"]];
        state.comparison.selectedModels.forEach(name => {
          const model = MODEL_CATALOG[name];
          if (!model) return;
          const cost = state.comparison.monthlyTasks * (state.comparison.inputTokensPerTask / 1000000 * model.input + state.comparison.outputTokensPerTask / 1000000 * model.output);
          rows.push([name, model.vendor, cost.toFixed(2), (cost / state.comparison.monthlyTasks).toFixed(5), model.quality, model.speed]);
        });
        const csv = rows.map(row => row.map(csvCell).join(",")).join("\n");
        downloadTextFile("usagescope-model-comparison.csv", csv, "text/csv");

      }

      function exportBudgets() {
        const rows = [["Budget", "Scope", "Limit", "Current Spend", "Utilization", "Status"]];
        state.budgets.forEach(budget => {
          const spend = getBudgetSpend(budget);
          const percent = budget.limit ? spend / budget.limit * 100 : 0;
          rows.push([budget.name, budget.scope, budget.limit.toFixed(2), spend.toFixed(2), percent.toFixed(1), getBudgetState(percent).label]);
        });
        const csv = rows.map(row => row.map(csvCell).join(",")).join("\n");
        downloadTextFile("usagescope-budgets.csv", csv, "text/csv");
        showToast("Budgets exported", "Budget status was downloaded as CSV.");
      }

      function exportTeam() {
        const rows = [["Name", "Email", "Team", "Role", "Spend", "Tasks", "Usage Records", "Status"]];
        state.team.forEach(member => {
          const usage = filteredUsage(currentPeriod).filter(item => item.memberId === member.id);
          rows.push([
            member.name,
            member.email,
            member.team,
            member.role,
            sum(usage, "cost").toFixed(2),
            sum(usage, "tasks"),
            usage.length,
            member.active ? "Active" : "Paused"
          ]);
        });
        const csv = rows.map(row => row.map(csvCell).join(",")).join("\n");
        downloadTextFile("usagescope-team.csv", csv, "text/csv");
        showToast("Team exported", "Team usage and attribution were downloaded.");
      }

      function usageToCsv(usage) {
        const headers = ["Date", "Member", "Team", "Vendor", "Model", "Project", "Task Type", "Input Tokens", "Output Tokens", "Tasks", "Cost", "Cost per Task"];
        const rows = usage.map(item => {
          const member = state.team.find(person => person.id === item.memberId);
          return [
            item.date,
            member?.name || "Unassigned",
            item.team,
            item.vendor,
            item.model,
            item.project,
            item.taskType,
            item.inputTokens,
            item.outputTokens,
            item.tasks,
            item.cost.toFixed(4),
            (item.tasks ? item.cost / item.tasks : 0).toFixed(6)
          ];
        });
        return [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\n");
      }

      function csvCell(value) {
        const string = String(value ?? "");
        return /[",\n]/.test(string) ? `"${string.replace(/"/g, '""')}"` : string;
      }

      function downloadTextFile(filename, content, type) {
        const blob = new Blob([content], { type: `${type};charset=utf-8` });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function resetDemoData() {
        if (!window.confirm("Reset this workspace to the original sample data? Current changes will be replaced.")) return;
        state = makeSeedState();
        usageSearch = "";
        usageVendor = "all";
        usageProject = "all";
        usagePage = 1;

      function showModal() {

      function drawCostChart() {
        const canvas = document.getElementById("costChart");
        if (!canvas) return;
        if (chartAnimationFrame) cancelAnimationFrame(chartAnimationFrame);
        const usage = filteredUsage(currentPeriod);
        const days = Math.min(currentPeriod, 30);
        const data = [];
        for (let index = days - 1; index >= 0; index--) {
          const date = new Date();
          date.setHours(12, 0, 0, 0);
          date.setDate(date.getDate() - index);
          const key = isoDate(date);
          data.push({
            date: key,
            value: sum(usage.filter(item => item.date === key), "cost")
          });
        }
        chartData = data;
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        const width = rect.width;
        const height = rect.height;
        const padding = { top: 15, right: 17, bottom: 31, left: 50 };
        const chartWidth = Math.max(1, width - padding.left - padding.right);
        const chartHeight = Math.max(1, height - padding.top - padding.bottom);
        const maxValue = Math.max(...data.map(item => item.value), 10);
        const niceMax = Math.ceil(maxValue / 20) * 20;
        const xAt = index => padding.left + (data.length === 1 ? chartWidth / 2 : index / (data.length - 1) * chartWidth);
        const yAt = value => padding.top + chartHeight - value / niceMax * chartHeight;

        ctx.clearRect(0, 0, width, height);
        ctx.font = "10px Inter, sans-serif";
        ctx.textBaseline = "middle";

        for (let line = 0; line <= 4; line++) {
          const y = padding.top + chartHeight / 4 * line;
          ctx.beginPath();
          ctx.strokeStyle = "#e8ecf2";
          ctx.lineWidth = 1;
          ctx.moveTo(padding.left, y);
          ctx.lineTo(width - padding.right, y);
          ctx.stroke();
          const labelValue = niceMax * (1 - line / 4);
          ctx.fillStyle = "#8b96a7";
          ctx.textAlign = "right";
          ctx.fillText(`$${labelValue.toFixed(0)}`, padding.left - 9, y);
        }

        const gradient = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartHeight);
        gradient.addColorStop(0, "rgba(79, 70, 229, 0.22)");
        gradient.addColorStop(1, "rgba(79, 70, 229, 0.015)");

        const progress = { value: 0 };
        const startTime = performance.now();
        const duration = 420;

        function animate(now) {
          const elapsed = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 3);
          progress.value = eased;
          ctx.clearRect(0, 0, width, height);

          for (let line = 0; line <= 4; line++) {
            const y = padding.top + chartHeight / 4 * line;
            ctx.beginPath();
            ctx.strokeStyle = "#e8ecf2";
            ctx.lineWidth = 1;
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();
            ctx.fillStyle = "#8b96a7";
            ctx.textAlign = "right";
            ctx.fillText(`$${(niceMax * (1 - line / 4)).toFixed(0)}`, padding.left - 9, y);
          }

          const points = data.map((item, index) => ({
            x: xAt(index),
            y: yAt(item.value * progress.value)
          }));

          if (points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, padding.top + chartHeight);
            points.forEach(point => ctx.lineTo(point.x, point.y));
            ctx.lineTo(points[points.length - 1].x, padding.top + chartHeight);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            points.forEach((point, index) => {
              if (index === 0) ctx.moveTo(point.x, point.y);
              else ctx.lineTo(point.x, point.y);
            });
            ctx.strokeStyle = "#4f46e5";
            ctx.lineWidth = 2.3;
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.stroke();

            points.forEach((point, index) => {
              if (data.length > 12 && index % Math.ceil(data.length / 7) !== 0 && index !== data.length - 1) return;
              ctx.beginPath();
              ctx.arc(point.x, point.y, 3.2, 0, Math.PI * 2);
              ctx.fillStyle = "#ffffff";
              ctx.fill();
              ctx.strokeStyle = "#4f46e5";
              ctx.lineWidth = 1.8;
              ctx.stroke();
            });
          }

          const labelIndexes = [];
          if (data.length <= 7) {
            data.forEach((_, index) => labelIndexes.push(index));
          } else {
            [0, Math.floor(data.length / 3), Math.floor(data.length * 2 / 3), data.length - 1].forEach(index => labelIndexes.push(index));
          }
          ctx.fillStyle = "#8b96a7";
          ctx.textAlign = "center";
          labelIndexes.forEach(index => {
            const date = new Date(`${data[index].date}T12:00:00`);
            const label = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(date);
            ctx.fillText(label, xAt(index), height - 13);
          });

          if (elapsed < 1) chartAnimationFrame = requestAnimationFrame(animate);
        }

        chartAnimationFrame = requestAnimationFrame(animate);
      }

      function truncate(value, length) {
        const string = String(value || "");
        return string.length > length ? `${string.slice(0, length - 1)}…` : string;
      }

      function initials(name) {
        return String(name || "?").split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase();
      }

      function avatarColor(name) {
        const colors = ["#4f46e5", "#0f9f8f", "#2873bd", "#b76a08", "#7c3aed", "#c73d4d"];
        const hash = String(name || "").split("").reduce((total, char) => total + char.charCodeAt(0), 0);
        return colors[hash % colors.length];
      }

      function maskApiKey(key) {
        const value = String(key || "");
        if (!value) return "Not connected";
        if (value.length <= 8) return "••••••••";
        return `${value.slice(0, 4)}••••••${value.slice(-4)}`;
      }

      document.querySelectorAll(".nav-button[data-view]").forEach(button => {
        button.addEventListener("click", () => navigateTo(button.dataset.view));
      });

      document.getElementById("globalPeriod").addEventListener("change", event => {
        currentPeriod = Number(event.target.value);
        usagePage = 1;
        render();
      });

      document.getElementById("refreshButton").addEventListener("click", () => {
        render();
        showToast("Data refreshed", "Your local workspace data is up to date.");
      });

      document.getElementById("notificationButton").addEventListener("click", () => {
        navigateTo("budgets");
      });

      document.getElementById("mobileMenuButton").addEventListener("click", () => {
        document.body.classList.toggle("sidebar-open");
      });

      document.getElementById("mobileOverlay").addEventListener("click", () => {
        document.body.classList.remove("sidebar-open");
      });

      document.getElementById("modalClose").addEventListener("click", closeModal);
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("mousedown", event => {
        if (event.target === event.getElementById("modalBackdrop")) closeModal();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !document.getElementById("modalBackdrop").hidden) closeModal();
      });

      window.addEventListener("resize", () => {
        if (currentView === "dashboard") drawCostChart();
      });

      render();
    })();
  </script>
