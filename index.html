<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Usagescope — AI Usage & Cost Intelligence</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f7;
      --text: #172033;
      --text-soft: #536176;
      --text-faint: #7d899c;
      --border: #dfe5ee;
      --border-strong: #cbd4e1;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-soft: #eef2ff;
      --teal: #0f9f8f;
      --teal-soft: #e8faf7;
      --green: #16855b;
      --green-soft: #eaf8f1;
      --amber: #b76a08;
      --amber-soft: #fff6e6;
      --red: #c73d4d;
      --red-soft: #fff0f2;
      --blue: #2873bd;
      --blue-soft: #eaf4ff;
      --sidebar: #111827;
      --sidebar-soft: #1a2437;
      --sidebar-text: #c6cfdd;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.07);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.1);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --sidebar-width: 244px;
      --header-height: 72px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    :focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.3);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      color: var(--sidebar-text);
      background:
        radial-gradient(circle at 15% 8%, rgba(99, 102, 241, 0.18), transparent 27%),
        var(--sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand {
      height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 22px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(145deg, #706df6, #4f46e5);
      box-shadow: 0 8px 18px rgba(79, 70, 229, 0.28);
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.025em;
    }

    .brand-name span {
      color: #a5b4fc;
    }

    .workspace {
      margin: 18px 14px 8px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.035);
    }

    .workspace-label {
      margin-bottom: 5px;
      color: #7f8da2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .workspace-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #eef2f7;
      font-size: 13px;
      font-weight: 650;
    }

    .workspace-name svg {
      width: 15px;
      color: #7f8da2;
    }

    .nav {
      flex: 1;
      padding: 12px 10px;
      overflow-y: auto;
    }

    .nav-label {
      padding: 10px 12px 7px;
      color: #6f7c90;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-button {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 2px 0;
      padding: 10px 12px;
      color: var(--sidebar-text);
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      transition: color 160ms ease, background 160ms ease;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.055);
    }

    .nav-button.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    .nav-button.active::before {
      position: absolute;
      left: -10px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      content: "";
      border-radius: 0 4px 4px 0;
      background: #818cf8;
    }

    .nav-icon {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      stroke-width: 1.8;
    }

    .nav-text {
      flex: 1;
      font-size: 13px;
      font-weight: 550;
    }

    .nav-badge {
      min-width: 21px;
      padding: 1px 6px;
      color: #c7d2fe;
      background: rgba(129, 140, 248, 0.17);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 750;
      text-align: center;
    }

    .sidebar-footer {
      padding: 13px 14px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .usage-meter-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #9eabbd;
      font-size: 11px;
    }

    .usage-meter-label strong {
      color: #dce4ef;
      font-weight: 650;
    }

    .meter-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
    }

    .meter-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
    }

    .sidebar-tip {
      margin-top: 11px;
      color: #7f8da2;
      font-size: 10px;
      line-height: 1.45;
    }

    .main {
      grid-column: 2;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .topbar-left,
    .topbar-actions,
    .header-title-wrap {
      display: flex;
      align-items: center;
    }

    .topbar-left {
      min-width: 0;
      gap: 13px;
    }

    .header-title-wrap {
      min-width: 0;
      gap: 10px;
    }

    .header-title {
      overflow: hidden;
      margin: 0;
      font-size: 17px;
      font-weight: 720;
      letter-spacing: -0.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-subtitle {
      margin: 1px 0 0;
      color: var(--text-faint);
      font-size: 11px;
    }

    .topbar-actions {
      gap: 9px;
    }

    .period-select {
      height: 36px;
      min-width: 128px;
      padding: 0 32px 0 11px;
      color: var(--text-soft);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .icon-button:hover {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: #c7d2fe;
    }

    .icon-button svg {
      width: 17px;
      height: 17px;
    }

    .mobile-menu-button {
      display: none;
    }

    .content {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 26px 28px 42px;
    }

    .view {
      animation: fade-in 180ms ease;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--primary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .page-heading h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .page-heading p {
      max-width: 700px;
      margin: 5px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .heading-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .button:hover:not(:disabled) {
      background: var(--surface-soft);
      border-color: #aeb9c9;
    }

    .button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .button svg {
      width: 15px;
      height: 15px;
    }

    .button-primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.17);
    }

    .button-primary:hover:not(:disabled) {
      color: #fff;
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .button-danger {
      color: var(--red);
      background: var(--surface);
      border-color: #f0bdc5;
    }

    .button-danger:hover:not(:disabled) {
      background: var(--red-soft);
      border-color: #e797a4;
    }

    .button-small {
      min-height: 32px;
      padding: 6px 10px;
      font-size: 11px;
    }

    .button-quiet {
      color: var(--primary);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .button-quiet:hover:not(:disabled) {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-color: transparent;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      margin: 0;
      font-size: 14px;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .card-subtitle {
      margin: 3px 0 0;
      color: var(--text-faint);
      font-size: 11px;
    }

    .card-body {
      padding: 20px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .metric-card {
      position: relative;
      min-height: 128px;
      overflow: hidden;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    .metric-card::after {
      position: absolute;
      right: -22px;
      bottom: -30px;
      width: 95px;
      height: 95px;
      content: "";
      border-radius: 50%;
      background: var(--metric-tint, var(--primary-soft));
      opacity: 0.65;
    }

    .metric-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-label {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 650;
    }

    .metric-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--metric-color, var(--primary));
      background: var(--metric-tint, var(--primary-soft));
      border-radius: 8px;
    }

    .metric-icon svg {
      width: 15px;
      height: 15px;
    }

    .metric-value {
      position: relative;
      z-index: 1;
      display: block;
      margin-top: 9px;
      font-size: 25px;
      font-weight: 760;
      letter-spacing: -0.045em;
    }

    .metric-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      color: var(--text-faint);
      font-size: 10px;
    }

    .trend {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-weight: 700;
    }

    .trend.up {
      color: var(--green);
    }

    .trend.down {
      color: var(--red);
    }

    .trend svg {
      width: 11px;
      height: 11px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(290px, 0.85fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .chart-card {
      min-width: 0;
    }

    .chart-wrap {
      position: relative;
      height: 264px;
      padding: 12px 16px 16px;
    }

    .chart-wrap canvas {
      width: 100%;
      height: 100%;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--text-soft);
      font-size: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--legend-color);
    }

    .budget-card {
      min-width: 0;
    }

    .budget-body {
      padding: 20px;
    }

    .budget-total {
      margin: 0;
      font-size: 30px;
      font-weight: 770;
      letter-spacing: -0.05em;
    }

    .budget-total span {
      color: var(--text-faint);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .budget-progress-label {
      display: flex;
      justify-content: space-between;
      margin: 17px 0 7px;
      color: var(--text-soft);
      font-size: 10px;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--progress-color, var(--primary));
      transition: width 250ms ease;
    }

    .budget-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .budget-detail {
      padding: 11px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .budget-detail span {
      display: block;
      color: var(--text-faint);
      font-size: 9px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .budget-detail strong {
      display: block;
      margin-top: 3px;
      font-size: 14px;
    }

    .alert-box {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding: 11px;
      color: var(--amber);
      background: var(--amber-soft);
      border: 1px solid #f3d7a6;
      border-radius: 10px;
    }

    .alert-box svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .alert-box strong {
      display: block;
      color: #865208;
      font-size: 11px;
    }

    .alert-box p {
      margin: 2px 0 0;
      color: #96651f;
      font-size: 10px;
    }

    .lower-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr);
      gap: 16px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      color: var(--text-faint);
      background: var(--surface-soft);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    td {
      color: var(--text-soft);
      font-size: 11px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #fafbfe;
    }

    .provider-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .provider-logo {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #fff;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .provider-name {
      color: var(--text);
      font-weight: 680;
    }

    .provider-model {
      color: var(--text-faint);
      font-size: 9px;
    }

    .cost-bar-cell {
      min-width: 150px;
    }

    .cost-bar {
      width: 90px;
      height: 5px;
      margin-top: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-muted);
    }

    .cost-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--bar-color, var(--primary));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 750;
      white-space: nowrap;
    }

    .badge-green {
      color: var(--green);
      background: var(--green-soft);
    }

    .badge-amber {
      color: var(--amber);
      background: var(--amber-soft);
    }

    .badge-red {
      color: var(--red);
      background: var(--red-soft);
    }

    .badge-blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .badge-neutral {
      color: var(--text-soft);
      background: var(--surface-muted);
    }

    .activity-list {
      display: grid;
      gap: 0;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child {
      border-bottom: 0;
    }

    .activity-icon {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--icon-color, var(--primary));
      background: var(--icon-bg, var(--primary-soft));
      border-radius: 8px;
    }

    .activity-icon svg {
      width: 14px;
      height: 14px;
    }

    .activity-content {
      min-width: 0;
      flex: 1;
    }

    .activity-title {
      margin: 0;
      color: var(--text);
      font-size: 11px;
      font-weight: 650;
    }

    .activity-description {
      margin: 2px 0 0;
      color: var(--text-faint);
      font-size: 10px;
    }

    .activity-time {
      color: var(--text-faint);
      font-size: 9px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      width: 15px;
      height: 15px;
      color: var(--text-faint);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-box input {
      width: 250px;
      height: 38px;
      padding: 8px 11px 8px 34px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      font-size: 12px;
    }

    .filter-select {
      height: 38px;
      min-width: 145px;
      padding: 0 32px 0 11px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
    }

    .inline-form-card {
      margin-bottom: 16px;
    }

    .form-grid {
      display: grid;
      grid-grid-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-soft);
      font-size: 10px;
      font-weight: 700;
    }

    .required {
      color: var(--red);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      font-size: 12px;
    }

    .field input,
    .field select {
      height: 39px;
      padding: 0 11px;
    }

    .field textarea {
      min-height: 92px;
      padding: 10px 11px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #a5afbd;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #9da2f4;
      outline: 3px solid rgba(79, 70, 229, 0.1);
    }

    .field-error {
      display: none;
      margin-top: 5px;
      color: var(--red);
      font-size: 10px;
    }

    .field.invalid .field-error {
      display: block;
    }

    .field.invalid input,
    .field.invalid select,
    .field.invalid textarea {
      border-color: #df8793;
      background: #fffafb;
    }

    .field-hint {
      margin-top: 5px;
      color: var(--text-faint);
      font-size: 9px;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 16px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
      overflow: hidden;
    }

    .summary-item {
      padding: 15px 18px;
      border-right: 1px solid var(--border);
    }

    .summary-item:last-child {
      border-right: 0;
    }

    .summary-item span {
      display: block;
      color: var(--text-faint);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .summary-item strong {
      display: block;
      margin-top: 4px;
      font-size: 17px;
      letter-spacing: -0.025em;
    }

    .empty-state {
      padding: 50px 24px;
      text-align: center;
    }

    .empty-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 13px;
    }

    .empty-icon svg {
      width: 22px;
      height: 22px;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 14px;
    }

    .empty-state p {
      max-width: 390px;
      margin: 5px auto 14px;
      color: var(--text-faint);
      font-size: 11px;
    }

    .loading-state {
      display: grid;
      place-items: center;
      min-height: 220px;
      color: var(--text-faint);
      font-size: 11px;
    }

    .spinner {
      width: 25px;
      height: 25px;
      margin-bottom: 10px;
      border: 3px solid var(--surface-muted);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
      gap: 16px;
      align-items: start;
    }

    .comparison-table input[type="number"] {
      width: 105px;
      height: 34px;
      padding: 0 8px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 11px;
    }

    .winner {
      position: relative;
      background: rgba(232, 250, 247, 0.45);
    }

    .winner::after {
      position: absolute;
      top: 7px;
      right: 8px;
      content: "Best";
      padding: 2px 6px;
      color: var(--teal);
      background: var(--teal-soft);
      border-radius: 99px;
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .recommendation {
      padding: 20px;
      background:
        radial-gradient(circle at 100% 0, rgba(15, 159, 143, 0.11), transparent 42%),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .recommendation h3 {
      margin: 0;
      font-size: 14px;
    }

    .recommendation-price {
      margin: 16px 0;
      padding: 14px;
      background: var(--teal-soft);
      border: 1px solid #c9eee8;
      border-radius: 12px;
    }

    .recommendation-price span {
      color: var(--text-soft);
      font-size: 10px;
    }

    .recommendation-price strong {
      display: block;
      margin-top: 2px;
      color: #08796e;
      font-size: 25px;
      letter-spacing: -0.04em;
    }

    .recommendation ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .recommendation li {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      color: var(--text-soft);
      font-size: 11px;
    }

    .recommendation li svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      color: var(--teal);
    }

    .settings-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 16px;
      align-items: start;
    }

    .settings-section + .settings-section {
      margin-top: 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-copy strong {
      display: block;
      font-size: 11px;
    }

    .setting-copy p {
      margin: 3px 0 0;
      color: var(--text-faint);
      font-size: 10px;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      background: #cbd5e1;
      border-radius: 999px;
      transition: background 160ms ease;
    }

    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      content: "";
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.24);
      transition: transform 160ms ease;
    }

    .switch input:checked + .switch-track {
      background: var(--primary);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(16px);
    }

    .switch input:focus-visible + .switch-track {
      outline: 3px solid rgba(79, 70, 229, 0.25);
      outline-offset: 2px;
    }

    .threshold-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .threshold-box {
      padding: 13px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .threshold-box label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-soft);
      font-size: 10px;
      font-weight: 650;
    }

    .threshold-box input {
      width: 100%;
      height: 36px;
      padding: 0 9px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 11px;
    }

    .data-actions {
      display: grid;
      gap: 9px;
    }

    .data-action {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px;
      color: var(--text-soft);
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: left;
    }

    .data-action:hover {
      background: var(--primary-soft);
      border-color: #c7d2fe;
    }

    .data-action svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .data-action strong {
      display: block;
      font-size: 10px;
    }

    .data-action span {
      display: block;
      color: var(--text-faint);
      font-size: 9px;
    }

    .toast-region {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 100;
      display: grid;
      gap: 9px;
      width: min(340px, calc(100vw - 32px));
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--toast-color, var(--primary));
      border-radius: 11px;
      box-shadow: var(--shadow-md);
      animation: toast-in 180ms ease;
    }

    .toast.success {
      --toast-color: var(--green);
    }

    .toast.error {
      --toast-color: var(--red);
    }

    .toast.warning {
      --toast-color: var(--amber);
    }

    .toast svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: var(--toast-color);
    }

    .toast strong {
      display: block;
      font-size: 11px;
    }

    .toast p {
      margin: 2px 0 0;
      color: var(--text-soft);
      font-size: 10px;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(3px);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(560px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      padding: 19px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .modal-header p {
      margin: 3px 0 0;
      color: var(--text-faint);
      font-size: 10px;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 15px 20px;
      background: var(--surface-soft);
      border-top: 1px solid var(--border);
    }

    .close-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--text-faint);
      background: transparent;
      border: 0;
      border-radius: 8px;
    }

    .close-button:hover {
      color: var(--text);
      background: var(--surface-muted);
    }

    .close-button svg {
      width: 17px;
      height: 17px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .text-link {
      padding: 0;
      color: var(--primary);
      background: transparent;
      border: 0;
      font-size: 10px;
      font-weight: 650;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    .mobile-overlay {
      display: none;
    }

    .inline-number {
      width: 74px;
      height: 29px;
      padding: 0 7px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      font-size: 10px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
    }

    .row-action {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--text-faint);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
    }

    .row-action:hover {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: #d8dcff;
    }

    .row-action.delete:hover {
      color: var(--red);
      background: var(--red-soft);
      border-color: #f4c8ce;
    }

    .row-action svg {
      width: 14px;
      height: 14px;
    }

    .muted {
      color: var(--text-faint);
    }

    .text-right {
      text-align: right;
    }

    .nowrap {
      white-space: nowrap;
    }

    .small-copy {
      color: var(--text-faint);
      font-size: 10px;
    }

    .full-span {
      grid-column: 1 / -1;
    }

    .callout {
      display: flex;
      gap: 10px;
      padding: 13px;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid #cce4fb;
      border-radius: 10px;
    }

    .callout svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .callout p {
      margin: 0;
      color: #376b9f;
      font-size: 10px;
    }

    .alert-list {
      display: grid;
      gap: 10px;
    }

    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .alert-item.warning {
      background: var(--amber-soft);
      border-color: #f1d6aa;
    }

    .alert-item.critical {
      background: var(--red-soft);
      border-color: #f0bec6;
    }

    .alert-item svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      color: var(--amber);
    }

    .alert-item.critical svg {
      color: var(--red);
    }

    .alert-item strong {
      display: block;
      font-size: 10px;
    }

    .alert-item p {
      margin: 2px 0 0;
      color: var(--text-soft);
      font-size: 9px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 18px;
      color: var(--text-faint);
      border-top: 1px solid var(--border);
      font-size: 10px;
    }

    .pagination-buttons {
      display: flex;
      gap: 6px;
    }

    .pagination-button {
      min-width: 31px;
      height: 30px;
      padding: 0 8px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 10px;
    }

    .pagination-button.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .budget-setting-list {
      display: grid;
      gap: 9px;
    }

    .budget-setting-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px 95px;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }

    .budget-setting-row:last-child {
      border-bottom: 0;
    }

    .budget-setting-name strong {
      display: block;
      font-size: 11px;
    }

    .budget-setting-name span {
      color: var(--text-faint);
      font-size: 9px;
    }

    .budget-setting-row input {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 10px;
    }

    .budget-setting-row select {
      width: 100%;
      height: 34px;
      padding: 0 7px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 10px;
    }

    .tag {
      display: inline-flex;
      padding: 2px 6px;
      color: var(--text-soft);
      background: var(--surface-muted);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 650;
    }

    .detail-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
      gap: 16px;
      align-items: start;
    }

    .detail-list {
      display: grid;
      gap: 0;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-row dt {
      color: var(--text-faint);
    }

    .detail-row dd {
      margin: 0;
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 1180px) {
      :root {
        --sidebar-width: 218px;
      }

      .metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid,
      .lower-grid,
      .comparison-grid,
      .settings-layout,
      .detail-panel {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        transform: translateX(-100%);
        transition: transform 180ms ease;
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .main {
        grid-column: 1;
      }

      .mobile-menu-button {
        display: grid;
      }

      .mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: block;
        visibility: hidden;
        background: rgba(15, 23, 42, 0.44);
        opacity: 0;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      body.sidebar-open .mobile-overlay {
        visibility: visible;
        opacity: 1;
      }

      .topbar {
        padding: 0 17px;
      }

      .content {
        padding: 21px 17px 35px;
      }

      .header-subtitle {
        display: none;
      }
    }

    @media (max-width: 620px) {
      .page-heading {
        flex-direction: column;
      }

      .heading-actions {
        width: 100%;
      }

      .heading-actions .button {
        flex: 1;
      }

      .metrics-grid,
      .summary-strip,
      .form-grid,
      .form-grid.three,
      .threshold-grid,
      .field-row {
        grid-template-columns: 1fr;
      }

      .summary-strip {
        grid-template-columns: 1fr 1fr;
      }

      .summary-item:nth-child(2) {
        border-right: 0;
      }

      .summary-item:nth-child(-n + 2) {
        border-bottom: 1px solid var(--border);
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .toolbar-group {
        align-items: stretch;
        flex-direction: column;
      }

      .search-box input,
      .filter-select {
        width: 100%;
      }

      .period-select {
        display: none;
      }

      .budget-setting-row {
        grid-template-columns: 1fr 1fr;
      }

      .budget-setting-name {
        grid-column: 1 / -1;
      }

      .detail-row {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .card-header {
        padding: 15px;
      }

      .card-body {
        padding: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <div class="app-shell">

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6Z"></path>
            <circle cx="12" cy="12" r="2.7"></circle>
          </svg>
        </div>
        <div class="brand-name">Usage<span>scope</span></div>
      </div>

      <div class="workspace">
        <div class="workspace-label">Workspace</div>
        <div class="workspace-name">
          <span id="workspaceName">Northstar AI Studio</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>

          return {
            ...seed,
            ...parsed,
            workspace: { ...seed.workspace, ...(parsed.workspace || {}) },
            settings: { ...seed.settings, ...(parsed.settings || {}) },
            comparison: { ...seed.comparison, ...(parsed.comparison || {}) },
            usage: Array.isArray(parsed.usage) ? parsed.usage : seed.usage,
            budgets: Array.isArray(parsed.budgets) ? parsed.budgets : seed.budgets,
            team: Array.isArray(parsed.team) ? parsed.team : seed.team,
            activities: Array.isArray(parsed.activities) ? parsed.activities : seed.activities
          };
        } catch (error) {
          return makeSeedState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return true;
        } catch (error) {
          showToast("Storage error", "Your changes could not be saved to this browser.", "error");
          return false;
        }
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatCurrency(value, digits = 2) {
        const number = Number(value || 0);
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: state.workspace.currency || "USD",
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }).format(number);
      }

      function formatNumber(value, digits = 0) {
        return new Intl.NumberFormat("en-US", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }).format(Number(value || 0));
      }

      function formatCompact(value) {
        return new Intl.NumberFormat("en-US", {
          notation: "compact",
          maximumFractionDigits: 1
        }).format(Number(value || 0));
      }

      function formatDate(value, options = {}) {
        const date = new Date(`${value}T12:00:00`);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
          year: options.year ? "numeric" : undefined
        }).format(date);
      }

      function relativeTime(value) {
        const date = new Date(`${value}T12:00:00`);
        const diff = Math.round((Date.now() - date.getTime()) / 86400000);
        if (diff <= 0) return "Today";
        if (diff === 1) return "Yesterday";
        if (diff < 7) return `${diff} days ago`;
        if (diff < 30) return `${Math.floor(diff / 7)} week${diff >= 14 ? "s" : ""} ago`;
        return formatDate(value, { year: true });
      }

      function periodStart(days) {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setDate(d.getDate() - (Number(days) - 1));
        return isoDate(d);
      }

      function filteredUsage(period = currentPeriod) {
        const start = periodStart(period);
        return state.usage.filter(item => item.date >= start);
      }

      function sum(list, key) {
        return list.reduce((total, item) => total + (Number(item[key]) || 0), 0);
      }

      function percentChange(current, previous) {
        if (!previous) return current ? 100 : 0;
        return ((current - previous) / previous) * 100;
      }

      function previousPeriodUsage(period) {
        const start = periodStart(period);
        const end = new Date(start);
        end.setDate(end.getDate() - 1);
        const previousEnd = isoDate(end);
        const previousStartDate = new Date(start);
        previousStartDate.setDate(previousStartDate.getDate() - Number(period));
        const previousStart = isoDate(previousStartDate);
        return state.usage.filter(item => item.date >= previousStart && item.date <= previousEnd);
      }

      function getAlertState(percent, budget) {
        if (!budget || budget <= 0) return { level: "safe", label: "No budget", className: "badge-neutral" };
        if (percent >= 100) return { level: "critical", label: "Over budget", className: "badge-red" };
        if (percent >= Number(state.workspace.warningThreshold || 80)) return { level: "warning", label: "Near limit", className: "badge-amber" };
        return { level: "safe", label: "On track", className: "badge-green" };
      }

      function getBudgetSpend(budget) {
        const list = filteredUsage(currentPeriod);
        if (budget.scope === "all") return sum(list, "cost");
        if (budget.scope === "Automation" || budget.scope === "Delivery" || budget.scope === "Strategy") {
          return sum(list.filter(item => item.team === budget.scope), "cost");
        }
        return sum(list.filter(item => item.vendor === budget.scope), "cost");
      }

      function showToast(title, message, type = "success") {
        const id = `toast-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.id = id;
        const icon = type === "success" ? ICONS.check : type === "error" ? ICONS.alert : ICONS.info;
        toast.innerHTML = `${icon}<div><strong>${escapeHtml(title)}</strong><p>${escapeHtml(message)}</p></div>`;
        document.getElementById("toastRegion").appendChild(toast);
        const timer = setTimeout(() => {
          toast.remove();
          toastTimers.delete(id);
        }, 4200);
        toastTimers.set(id, timer);
      }

      function addActivity(type, title, description) {
        state.activities.unshift({
          id: `a-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          type,
          title,
          description,
          date: isoDate(new Date())
        });
        state.activities = state.activities.slice(0, 30);
      }

      function render() {
        const route = ROUTES[currentView] || ROUTES.dashboard;
        document.getElementById("headerTitle").textContent = route.title;
        document.getElementById("headerSubtitle").textContent = route.subtitle;
        document.querySelectorAll(".nav-button[data-view]").forEach(button => {
          const active = button.dataset.view === currentView;
          button.classList.toggle("active", active);
          if (active) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
        document.getElementById("teamBadge").textContent = state.team.length;
        document.getElementById("workspaceName").textContent = state.workspace.name;

        updateSidebarUsage();

        const content = document.getElementById("appContent");
        if (currentView === "dashboard") content.innerHTML = renderDashboard();
        if (currentView === "usage") content.innerHTML = renderUsage();
        if (currentView === "comparison") content.innerHTML = renderComparison();
        if (currentView === "budgets") content.innerHTML = renderBudgets();
        if (currentView === "team") content.innerHTML = renderTeam();
        if (currentView === "settings") content.innerHTML = renderSettings();

        if (currentView === "dashboard") {
          requestAnimationFrame(drawCostChart);
        }
        bindViewEvents();
      }

      function updateSidebarUsage() {
        const spend = sum(filteredUsage(currentPeriod), "cost");
        const budget = Number(state.workspace.monthlyBudget || 0);
        const percent = budget > 0 ? Math.min(100, spend / budget * 100) : 0;
        document.getElementById("sidebarUsageText").textContent = `${Math.round(percent)}%`;
        document.getElementById("sidebarUsageFill").style.width = `${percent}%`;
        const fill = document.getElementById("sidebarUsageFill");
        if (percent >= 100) {
          fill.style.background = "linear-gradient(90deg, #ef5f6d, #d83c4d)";
          document.getElementById("sidebarTip").textContent = "Budget exceeded. Review usage and take action.";
        } else if (percent >= Number(state.workspace.warningThreshold || 80)) {
          fill.style.background = "linear-gradient(90deg, #f2aa45, #d98214)";
          document.getElementById("sidebarTip").textContent = "Spend is approaching your monthly limit.";
        } else {
          fill.style.background = "linear-gradient(90deg, #6366f1, #8b5cf6)";
          document.getElementById("sidebarTip").textContent = `${formatCurrency(Math.max(0, budget - spend))} remains in your monthly budget.`;
        }
      }

      function renderDashboard() {
        const current = filteredUsage(currentPeriod);
        const previous = previousPeriodUsage(currentPeriod);
        const spend = sum(current, "cost");
        const previousSpend = sum(previous, "cost");
        const tasks = sum(current, "tasks");
        const previousTasks = sum(previous, "tasks");
        const tokens = sum(current, "inputTokens") + sum(current, "outputTokens");
        const costPerTask = tasks ? spend / tasks : 0;
        const previousCostPerTask = previousTasks ? previousSpend / previousTasks : 0;
        const budget = Number(state.workspace.monthlyBudget || 0);
        const budgetPercent = budget ? spend / budget * 100 : 0;
        const alertState = getBudgetState(budgetPercent);
        const spendChange = percentChange(spend, previousSpend);
        const taskChange = percentChange(tasks, previousTasks);
        const cptChange = percentChange(costPerTask, previousCostPerTask);
        const tokenChange = percentChange(tokens, sum(previous, "inputTokens") + sum(previous, "outputTokens"));
        const vendors = aggregateBy(current, "vendor");
        const projects = aggregateBy(current, "project");
        const topProject = projects[0];
        const topVendor = vendors[0];
        const activities = state.activities.slice(0, 5);

        return `
          <section class="view" aria-labelledby="dashboardHeading">
            <div class="page-heading">
              <div>
                <p class="eyebrow">Cost command center</p>
                <h2 id="dashboardHeading">Good morning, here’s your AI spend.</h2>
                <p>See what your team is spending, what each task really costs, and where optimization opportunities are hiding.</p>
              </div>
              <div class="heading-actions">
                <button class="button" type="button" data-action="export-dashboard">${ICONS.download} Export</button>
                <button class="button button-primary" type="button" data-action="add-usage">${ICONS.plus} Add usage</button>
              </div>
            </div>

            <div class="metrics-grid">
              ${metricCard("Total AI spend", formatCurrency(spend), spendChange, "up", "vs previous period", "dollar", "#4f46e5", "#eef2ff")}
              ${metricCard("Effective cost / task", formatCurrency(costPerTask, 4), cptChange, "down", "lower is better", "efficiency", "#0f9f8f", "#e8faf7")}
              ${metricCard("Tasks completed", formatCompact(tasks), taskChange, "up", "vs previous period", "tasks", "#2873bd", "#eaf4ff")}
              ${metricCard("Tokens processed", formatCompact(tokens), tokenChange, "up", "input + output", "sparkles", "#b76a08", "#fff6e6")}
            </div>

            <div class="dashboard-grid">
              <section class="card chart-card" aria-labelledby="costChartTitle">
                <div class="card-header">
                  <div>
                    <h3 class="card-title" id="costChartTitle">Cost over time</h3>
                    <p class="card-subtitle">Actual API spend grouped by day</p>
                  </div>
                  <div class="chart-legend">
                    <span class="legend-item"><span class="legend-dot" style="--legend-color:#4f46e5"></span>Usage cost</span>
                  </div>
                </div>
                <div class="chart-wrap">
                  <canvas id="costChart" role="img" aria-label="Line chart showing AI usage cost over the selected period"></canvas>
                </div>
              </section>

              <section class="card budget-card" aria-labelledby="budgetSnapshotTitle">
                <div class="card-header">
                  <div>
                    <h3 class="card-title" id="budgetSnapshotTitle">Monthly budget</h3>
                    <p class="card-subtitle">Current period allocation</p>
                  </div>
                  <span class="badge ${alertState.className}">${alertState.label}</span>
                </div>
                <div class="budget-body">
                  <p class="budget-total">${formatCurrency(spend)} <span>/ ${formatCurrency(budget, 0)}</span></p>
                  <div class="budget-progress-label">
                    <span>${Math.round(budgetPercent)}% used</span>
                    <span>${formatCurrency(Math.max(0, budget - spend))} left</span>
                  </div>
                  <div class="progress-track" role="progressbar" aria-label="Monthly budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(budgetPercent)}">
                    <div class="progress-fill" style="width:${Math.min(100, Math.max(0, budgetPercent))}%;--progress-color:${alertState.color}"></div>
                  </div>
                  <div class="budget-details">
                    <div class="budget-detail"><span>Forecast</span><strong>${formatCurrency(projectedSpend(current, budgetPercent))}</strong></div>
                    <div class="budget-detail"><span>Daily average</span><strong>${formatCurrency(spend / Math.max(1, currentPeriod))}</strong></div>
                    <div class="budget-detail"><span>Top vendor</span><strong>${escapeHtml(topVendor?.key || "—")}</strong></div>
                    <div class="budget-detail"><span>Top project</span><strong title="${escapeHtml(topProject?.key || "")}">${escapeHtml(truncate(topProject?.key || "—", 22))}</strong></div>
                  </div>
                  ${budgetPercent >= Number(state.workspace.warningThreshold || 80) ? `
                    <div class="alert-box">
                      ${ICONS.alert}
                      <div>
                        <strong>${budgetPercent >= 100 ? "Budget exceeded" : "Approaching budget limit"}</strong>
                        <p>${budgetPercent >= 100 ? `You are ${formatCurrency(spend - budget)} over your monthly limit.` : `${formatCurrency(budget - spend)} remains before your warning threshold is reached.`}</p>
                      </div>
                    </div>` : `
                    <div class="alert-box" style="color:var(--teal);background:var(--teal-soft);border-color:#c7eee8">
                      ${ICONS.check}
                      <div>
                        <strong style="color:#08796e">Spending is on track</strong>
                        <p style="color:#3c827b">Your forecast remains within the configured monthly budget.</p>
                      </div>
                    </div>`}
                </div>
              </section>
            </div>

            <div class="lower-grid">
              <section class="card" aria-labelledby="vendorSpendTitle">
                <div class="card-header">
                  <div>
                    <h3 class="card-title" id="vendorSpendTitle">Vendor spend breakdown</h3>
                    <p class="card-subtitle">Cost and task efficiency by provider</p>
                  </div>
                  <button class="text-link" type="button" data-action="navigate-usage">View all usage</button>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Vendor</th><th>Cost</th><th>Tasks</th><th>Cost / task</th><th>Share</th><th>Status</th></tr></thead>
                    <tbody>
                      ${vendors.length ? vendors.slice(0, 5).map(vendor => {
                        const vendorCost = vendor.value;
                        const vendorTasks = sum(current.filter(item => item.vendor === vendor.key), "tasks");
                        const vendorCpt = vendorTasks ? vendorCost / vendorTasks : 0;
                        const share = spend ? vendorCost / spend * 100 : 0;
                        const color = VENDORS[vendor.key]?.color || "#4f46e5";
                        return `<tr>
                          <td><div class="provider-cell"><span class="provider-logo" style="background:${color}">${escapeHtml(vendor.key.slice(0, 2).toUpperCase())}</span><div><div class="provider-name">${escapeHtml(vendor.key)}</div><div class="provider-model">${current.filter(item => item.vendor === vendor.key).length} usage records</div></div></div></td>
                          <td><strong>${formatCurrency(vendorCost)}</strong></td>
                          <td>${formatCompact(vendorTasks)}</td>
                          <td>${formatCurrency(vendorCpt, 4)}</td>
                          <td class="cost-bar-cell"><strong>${share.toFixed(1)}%</strong><div class="cost-bar"><span style="width:${share}%;--bar-color:${color}"></span></div></td>
                          <td><span class="badge badge-neutral">${share > 50 ? "High share" : "Normal"}</span></td>
                        </tr>`;
                      }).join("") : emptyTableRow(6, "No vendor usage in this period")}
                    </tbody>
                  </table>
                </div>
              </section>

              <section class="card" aria-labelledby="activityTitle">
                <div class="card-header">
                  <div>
                    <h3 class="card-title" id="activityTitle">Recent activity</h3>
                    <p class="card-subtitle">Workspace changes and alerts</p>
                  </div>
                </div>
                <div class="activity-list">
                  ${activities.length ? activities.map(activity => {
                    const style = activityStyle(activity.type);
                    return `<div class="activity-item">
                      <div class="activity-icon" style="--icon-color:${style.color};--icon-bg:${style.bg}">${style.icon}</div>
                      <div class="activity-content">
                        <p class="activity-title">${escapeHtml(activity.title)}</p>
                        <p class="activity-description">${escapeHtml(activity.description)}</p>
                      </div>
                      <span class="activity-time">${relativeTime(activity.date)}</span>
                    </div>`;
                  }).join("") : `<div class="empty-state"><div class="empty-icon">${ICONS.sparkles}</div><h3>No activity yet</h3><p>Add a usage record or connect a team member to begin.</p></div>`}
                </div>
              </section>
            </div>
          </section>`;
      }

      function metricCard(label, value, change, direction, meta, icon, color, tint) {
        const favorable = direction === "down" ? change <= 0 : change >= 0;
        const trendClass = change === 0 ? "" : favorable ? "up" : "down";
        const trendIcon = change >= 0 ? ICONS.up : ICONS.down;
        return `
          <article class="metric-card" style="--metric-color:${color};--metric-tint:${tint}">
            <div class="metric-top">
              <span class="metric-label">${escapeHtml(label)}</span>
              <span class="metric-icon">${ICONS[icon] || ICONS.info}</span>
            </div>
            <strong class="metric-value">${escapeHtml(value)}</strong>
            <div class="metric-meta">
              <span class="trend ${trendClass}">${change !== 0 ? trendIcon : ""}${Math.abs(change).toFixed(1)}%</span>
              <span>${escapeHtml(meta)}</span>
            </div>
          </article>`;
      }

      function aggregateBy(list, key) {
        const map = new Map();
        list.forEach(item => {
          const value = item[key] || "Unassigned";
          map.set(value, (map.get(value) || 0) + Number(item.cost || 0));
        });
        return [...map.entries()]
          .map(([entryKey, value]) => ({ key: entryKey, value }))
          .sort((a, b) => b.value - a.value);
      }

      function projectedSpend(current, percent) {
        if (!current.length) return 0;
        const daysElapsed = Math.min(currentPeriod, 30);
        const factor = currentPeriod <= 30 ? 30 / daysElapsed : 1;
        return sum(current, "cost") * factor;
      }

      function activityStyle(type) {
        if (type === "budget") return { color: "#b76a08", bg: "#fff6e6", icon: ICONS.budget };
        if (type === "comparison") return { color: "#4f46e5", bg: "#eef2ff", icon: ICONS.tasks };
        if (type === "team") return { color: "#0f9f8f", bg: "#e8faf7", icon: ICONS.users };
        return { color: "#2873bd", bg: "#eaf4ff", icon: ICONS.file };
      }

      function getBudgetState(percent) {
        if (percent >= 100) return { level: "critical", label: "Over budget", className: "badge-red", color: "#c73d4d" };
        if (percent >= Number(state.workspace.warningThreshold || 80)) return { level: "warning", label: "Near limit", className: "badge-amber", color: "#d98214" };
        return { level: "safe", label: "On track", className: "badge-green", color: "#16855b" };
      }

      function emptyTableRow(columns, message) {
        return `<tr><td colspan="${columns}" style="text-align:center;padding:36px;color:var(--text-faint)">${escapeHtml(message)}</td></tr>`;
      }

      function renderUsage() {
        const current = filteredUsage(currentPeriod);
        const projects = [...new Set(state.usage.map(item => item.project))].sort();
        const vendors = [...new Set(state.usage.map(item => item.vendor))].sort();
        const search = usageSearch.toLowerCase();
        const filtered = current.filter(item => {
          const member = state.team.find(person => person.id === item.memberId);
          const haystack = `${item.project} ${item.model} ${item.vendor} ${item.taskType} ${member?.name || ""} ${item.note || ""}`.toLowerCase();
          return (!search || haystack.includes(search)) &&
            (usageVendor === "all" || item.vendor === usageVendor) &&
            (usageProject === "all" || item.project === usageProject);
        });
        const pageSize = 8;
        const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
        usagePage = Math.min(usagePage, pages);
        const paged = filtered.slice((usagePage - 1) * pageSize, usagePage * pageSize);
        const totalCost = sum(current, "cost");
        const totalTasks = sum(current, "tasks");
        const totalTokens = sum(current, "inputTokens") + sum(current, "outputTokens");
        const avgBatch = current.length ? totalCost / current.length : 0;

        return `
          <section class="view" aria-labelledby="usageHeading">
            <div class="page-heading">
              <div>
                <p class="eyebrow">Usage ledger</p>
                <h2 id="usageHeading">Every token, task, and dollar accounted for.</h2>
                <p>Import usage from your team or log it manually to see true cost-per-task performance.</p>
              </div>
              <div class="heading-actions">
                <button class="button" type="button" data-action="import-usage">${ICONS.upload} Import CSV</button>
                <button class="button button-primary" type="button" data-action="add-usage">${ICONS.plus} Add usage</button>
              </div>
            </div>

            <div class="card summary-strip">
              <div class="summary-item"><span>Total spend</span><strong>${formatCurrency(totalCost)}</strong></div>
              <div class="summary-item"><span>Tasks completed</span><strong>${formatCompact(totalTasks)}</strong></div>
              <div class="summary-item"><span>Tokens processed</span><strong>${formatCompact(totalTokens)}</strong></div>
              <div class="summary-item"><span>Average batch cost</span><strong>${formatCurrency(avgBatch)}</strong></div>
            </div>

            <section class="card inline-form-card" aria-labelledby="quickUsageTitle">
              <div class="card-header">
                <div>
                  <h3 class="card-title" id="quickUsageTitle">Log usage quickly</h3>
                  <p class="card-subtitle">Record a batch of tasks; cost is calculated automatically from model rates.</p>
                </div>
              </div>
              <div class="card-body">
                <form id="quickUsageForm" novalidate>
                  <div class="form-grid">
                    <div class="field">
                      <label for="quickDate">Date <span class="required">*</span></label>
                      <input id="quickDate" name="date" type="date" max="${isoDate(new Date())}" value="${isoDate(new Date())}" required>
                      <div class="field-error">Choose a valid usage date.</div>
                    </div>
                    <div class="field">
                      <label for="quickMember">Team member <span class="required">*</span></label>
                      <select id="quickMember" name="memberId" required>
                        <option value="">Select member</option>
                        ${state.team.map(member => `<option value="${member.id}">${escapeHtml(member.name)} · ${escapeHtml(member.team)}</option>`).join("")}
                      </select>
                      <div class="field-error">Select the person who used the model.</div>
                    </div>
                    <div class="field">
                      <label for="quickModel">Model <span class="required">*</span></label>
                      <select id="quickModel" name="model" required>
                        <option value="">Select model</option>
                        ${Object.entries(MODEL_CATALOG).map(([model, data]) => `<option value="${escapeHtml(model)}">${escapeHtml(model)} · ${escapeHtml(data.vendor)}</option>`).join("")}
                      </select>
                      <div class="field-error">Select a model.</div>
                    </div>
                    <div class="field">
                      <label for="quickTasks">Completed tasks <span class="required">*</span></label>
                      <input id="quickTasks" name="tasks" type="number" min="1" step="1" placeholder="e.g. 500" required>
                      <div class="field-error">Enter a whole number greater than zero.</div>
                    </div>
                    <div class="field">
                      <label for="quickInput">Input tokens <span class="required">*</span></label>
                      <input id="quickInput" name="inputTokens" type="number" min="0" step="1" placeholder="e.g. 100000" required>
                      <div class="field-error">Enter zero or a positive token count.</div>
                    </div>
                    <div class="field">
                      <label for="quickOutput">Output tokens <span class="required">*</span></label>
                      <input id="quickOutput" name="outputTokens" type="number" min="0" step="1" placeholder="e.g. 25000" required>
                      <div class="field-error">Enter zero or a positive token count.</div>
                    </div>
                    <div class="field">
                      <label for="quickProject">Project <span class="required">*</span></label>
                      <input id="quickProject" name="project" type="text" maxlength="80" placeholder="Client or internal project" required>
                      <div class="field-error">Enter a project name.</div>
                    </div>
                    <div class="field">
                      <label for="quickTaskType">Task type</label>
                      <select id="quickTaskType" name="taskType">
                        ${["Customer support", "Content generation", "Research", "Classification", "Extraction", "Summarization", "Code generation", "Other"].map(type => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join("")}
                      </select>
                    </div>
                  </div>
                  <div class="form-actions">
                    <button class="button" type="reset">Clear</button>
                    <button class="button button-primary" type="submit">Add usage record</button>
                  </div>
                </form>
              </div>
            </section>

            <div class="toolbar">
              <div class="toolbar-group">
                <div class="search-box">
                  <label class="sr-only" for="usageSearch">Search usage</label>
                  ${ICONS.search}

      function renderComparison() {
        const comparison = state.comparison;
        const models = Object.entries(MODEL_CATALOG).map(([name, data]) => {
          const monthlyCost = comparison.monthlyTasks * (
            comparison.inputTokensPerTask / 1000000 * data.input +
            comparison.outputTokensPerTask / 1000000 * data.output
          );
          const qualityPass = data.quality >= comparison.requiredQuality;
          const score = data.quality * 0.62 + data.speed * 0.23 + (monthlyCost > 0 ? Math.max(0, 100 - monthlyCost * 0.75) : 100) * 0.15;
          return { name, ...data, monthlyCost, qualityPass, score };
        });
        const eligible = models.filter(model => model.qualityPass && model.selectedModels.includes(model.name));
        const ranked = [...eligible].sort((a, b) => a.monthlyCost - b.monthlyCost);
        const best = ranked[0];
        const second = ranked[1];
        const savings = second ? second.monthlyCost - best.monthlyCost : 0;

        return `
          <section class="view" aria-labelledby="comparisonHeading">
            <div class="page-heading">
              <div>
                <p class="eyebrow">Decision workspace</p>
                <h2 id="comparisonHeading">Choose the right model for the work.</h2>
                <p>Use your real task volume and token patterns to compare realistic monthly cost, quality, and speed.</p>
              </div>
              <div class="heading-actions">
                <button class="button" type="button" data-action="export-comparison">${ICONS.download} Export estimate</button>
              </div>
            </div>

            <section class="card inline-form-card" aria-labelledby="workloadTitle">
              <div class="card-header">
                <div>
                  <h3 class="card-title" id="workloadTitle">Your workload</h3>
                  <p class="card-subtitle">Update these assumptions as your client mix changes.</p>
                </div>
              </div>
              <div class="card-body">
                <form id="comparisonForm" novalidate>
                  <div class="form-grid three">
                    <div class="field">
                      <label for="monthlyTasks">Tasks per month <span class="required">*</span></label>
                      <input id="monthlyTasks" name="monthlyTasks" type="number" min="1" step="100" value="${comparison.monthlyTasks}" required>
                      <div class="field-error">Enter at least one task per month.</div>
                    </div>
                    <div class="field">
                      <label for="inputTokensPerTask">Input tokens / task</label>
                      <input id="inputTokensPerTask" name="inputTokensPerTask" type="number" min="0" step="10" value="${comparison.inputTokensPerTask}">
                    </div>
                    <div class="field">
                      <label for="outputTokensPerTask">Output tokens / task</label>
                      <input id="outputTokensPerTask" name="outputTokensPerTask" type="number" min="0" step="10" value="${comparison.outputTokensPerTask}">
                    </div>
                    <div class="field">
                      <label for="requiredQuality">Minimum quality score</label>
                      <input id="requiredQuality" name="requiredQuality" type="number" min="0" max="100" step="1" value="${comparison.requiredQuality}">
                      <div class="field-hint">Models below this score are excluded from the recommendation.</div>
                    </div>
                    <div class="field full">
                      <label>Models to compare</label>
                      <div class="toolbar-group" id="modelCheckboxes">
                        ${models.map(model => `<label style="display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;color:var(--text-soft);font-size:10px;background:var(--surface)">
                          <input type="checkbox" name="selectedModels" value="${escapeHtml(model.name)}" ${comparison.selectedModels.includes(model.name) ? "checked" : ""}>
                          ${escapeHtml(model.name)}
                        </label>`).join("")}
                      </div>
                    </div>
                  </div>
                  <div class="form-actions">
                    <button class="button" type="button" data-action="reset-comparison">Reset</button>
                    <button class="button button-primary" type="submit">Update estimate</button>
                  </div>
                </form>
              </div>
            </section>

            <div class="comparison-grid">
              <section class="card" aria-labelledby="comparisonTableTitle">
                <div class="card-header">
                  <div>
                    <h3 class="card-title" id="comparisonTableTitle">Cost and performance comparison</h3>
                    <p class="card-subtitle">Prices shown per 1M tokens; estimates include your workload mix</p>
                  </div>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Model</th><th>Est. monthly</th><th>Cost / task</th><th>Quality</th><th>Speed</th><th>Eligible</th></tr></thead>
                    <tbody>
                      ${models.filter(model => comparison.selectedModels.includes(model.name)).sort((a, b) => a.monthlyCost - b.monthlyCost).map(model => `
                        <tr class="${best && model.name === best.name ? "winner" : ""}">
                          <td><div class="provider-cell"><span class="provider-logo" style="background:${VENDORS[model.vendor]?.color || "#4f46e5"}">${escapeHtml(model.vendor.slice(0, 2).toUpperCase())}</span><div><div class="provider-name">${escapeHtml(model.name)}</div><div class="provider-model">${escapeHtml(model.vendor)}</div></div></div></td>
                          <td><strong>${formatCurrency(model.monthlyCost)}</strong></td>
                          <td>${formatCurrency(model.monthlyCost / comparison.monthlyTasks, 5)}</td>
                          <td><span class="badge ${model.quality >= 85 ? "badge-green" : model.quality >= 75 ? "badge-blue" : "badge-neutral"}">${model.quality}/100</span></td>
                          <td>${model.speed}/100</td>
                          <td><span class="badge ${model.qualityPass ? "badge-green" : "badge-red"}">${model.qualityPass ? "Yes" : "Below target"}</span></td>

                  <strong>${best ? formatCurrency(best.monthlyCost) : "—"}</strong>
                </div>
                ${best ? `
                  <ul>
                    <li>${ICONS.check}<span>Meets your quality target of ${comparison.requiredQuality}/100</span></li>
                    <li>${ICONS.check}<span>Estimated ${formatCurrency(best.monthlyCost / comparison.monthlyTasks, 5)} per completed task</span></li>
                    ${savings > 0 ? `<li>${ICONS.check}<span>Saves approximately ${formatCurrency(savings)} per month versus ${escapeHtml(second.name)}</span></li>` : ""}
                    <li>${ICONS.info}<span>Vendor: ${escapeHtml(best.vendor)} · Speed score ${best.speed}/100</span></li>
                  </ul>` : `
                  <div class="callout">${ICONS.info}<p>Select at least one model that meets your minimum quality score.</p></div>`}
                <button class="button button-primary" style="width:100%;margin-top:18px" type="button" data-action="apply-recommendation" ${best ? "" : "disabled"}>Use recommended model</button>
              </aside>
            </div>
          </section>`;
      }

      function renderBudgets() {
        const current = filteredUsage(currentPeriod);
        const totalSpend = sum(current, "cost");
        const workspaceBudget = Number(state.workspace.monthlyBudget || 0);
        const workspacePercent = workspaceBudget ? totalSpend / workspaceBudget * 100 : 0;
        const workspaceState = getBudgetState(workspacePercent);
        const alerts = [];
        state.budgets.filter(budget => budget.enabled).forEach(budget => {
          const spend = getBudgetSpend(budget);
          const percent = budget.limit ? spend / budget.limit * 100 : 0;
          if (percent >= 100) alerts.push({ budget, spend, percent, critical: true });
          else if (percent >= Number(budget.threshold || 80)) alerts.push({ budget, spend, percent, critical: false });
        });
        const totalBudget = sum(state.budgets.filter(budget => budget.enabled), "limit");
        const totalPercent = totalBudget ? totalSpend / totalBudget * 100 : 0;

        return `
          <section class="view" aria-labelledby="budgetsHeading">

              <div>
                <p class="eyebrow">Spend controls</p>
                <h2 id="budgetsHeading">Catch overruns before they happen.</h2>

              </div>
              <div class="heading-actions">
                <button class="button" type="button" data-action="export-budgets">${ICONS.download} Export</button>
